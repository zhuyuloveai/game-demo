<section>
  <h2>存档保护场景</h2>
  <p>
    下列按钮只重置一次性验收槽，不访问正式玩家存档。迁移备份键也使用独立前缀。
  </p>
  <button data-save-version="1">准备v1旧档</button
  ><button data-save-version="2">准备v2旧档</button
  ><button data-save-version="4">准备未知高版本</button
  ><button data-save-version="broken">准备损坏存档</button>
</section>
<script type="module">
  import { createGame } from "./legacy-engine.mjs";
  document.addEventListener("click", (event) => {
    const version = event.target.dataset.saveVersion;
    if (
      !version ||
      !["localhost", "127.0.0.1", "::1"].includes(location.hostname)
    )
      return;
    const s = createGame(null, Date.now());
    s.version = Number(version);
    s.stage = 8;
    s.xp = 275;
    s.energy = 73;
    s.stars = 26;
    s.pending.push({ id: "fixture-old-chest", family: "chest", level: 3 });
    localStorage.setItem(
      "little-kitchen-qa-migration",
      version === "broken" ? "invalid-json" : JSON.stringify(s),
    );
    location.href = "./index.html?qa=migration";
  });
</script>
