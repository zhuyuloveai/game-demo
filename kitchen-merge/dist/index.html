<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="掌心里的世界美食厨房：合成食材、升级厨具、制作食谱，和糯米一起完成客人的小心愿。">
  <title>小厨合合 · 世界美食厨房</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f4f1ec'/%3E%3Cpath d='M13 30h38v7a19 19 0 0 1-38 0z' fill='%23ee6a3f'/%3E%3Cpath d='M13 30h38v3H13z' fill='%23d9552c'/%3E%3Cpath d='M26 21q-5-4 0-9m12 9q-5-4 0-9' fill='none' stroke='%23a59f97' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./scene.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main class="game-shell k-design" aria-label="小厨合合游戏">
    <header class="k-hud" aria-label="厨房等级和资源">
      <div class="k-level"><h1>小厨合合</h1><small id="kitchen-level-label">Lv. 1 见习小厨</small><div class="screen-reader"><span id="xp-label">0/100</span><span id="xp-progress"></span></div></div>
      <button class="v-meter" data-action="energy" aria-label="查看剩余电量和补充电量"><span id="energy-icon" aria-hidden="true"></span><strong id="energy-count">100</strong></button>
      <button class="v-cash" data-action="cash" aria-label="查看小猪存钱罐里的金币"><span class="v-pig"><i class="v-pig-slot" aria-hidden="true"></i><span class="v-pig-head" aria-hidden="true"><i class="v-pig-eye"></i><i class="v-pig-nose"></i></span><strong id="coin-count">120</strong></span></button>
      <button class="v-stars" data-action="stars" aria-label="打开折纸星星罐，查看心愿星"><span class="v-stars-jar"><i class="v-paper-star" aria-hidden="true"></i><i class="v-paper-star" aria-hidden="true"></i><i class="v-paper-star" aria-hidden="true"></i><i class="v-paper-star" aria-hidden="true"></i><i class="v-paper-star" aria-hidden="true"></i><i class="v-paper-star" aria-hidden="true"></i><strong id="star-count">0</strong></span></button>
    </header>
    <section class="k-scene" aria-label="糯米厨房与客人订单">
      <div class="k-wallpaper" aria-hidden="true"></div>
      <div class="k-upper-cabinets">
        <button class="e-cupboard" data-action="storage" aria-label="打开收纳柜" aria-expanded="false"><span class="e-cupboard-inside" id="cabinet-art" aria-hidden="true"></span><span class="e-door"><em>收纳</em><i></i></span><small class="e-storage-count" id="storage-count">0/6</small></button>
        <div aria-hidden="true"></div><div class="v-right-cabinet" aria-hidden="true"></div>
      </div>
      <div class="k-rangehood" aria-hidden="true"><span class="k-hood-stack"></span><span class="k-hood-shell"><i>糯米厨房</i></span><span class="k-hood-trim"></span><span class="k-hood-light"></span></div>
      <div class="k-order-rail" aria-hidden="true"></div><div class="k-counter" aria-hidden="true"></div>
      <div class="screen-reader">客人的小心愿 <span id="order-count">3</span>，已送出 <b id="completed-count">0</b> 单。</div>
      <div id="orders" class="orders-list k-orders"></div>
    </section>
    <section class="workbench k-worktop" aria-label="合成料理台">
      <div class="v-slab"><div class="selection-card" id="selection-card" aria-live="polite"></div><div id="board" class="board" role="group" aria-label="七乘七合成棋盘"></div></div>
      <span id="save-label" class="screen-reader" role="status">进度已自动保存在当前浏览器</span>
    </section>
    <section class="e-foreground" aria-label="厨房桌面上的功能物件">
      <button class="e-speech" data-action="tasks" aria-label="查看糯米的章节任务手账"><b>糯米的开店手账</b><span id="quest-copy">一起完成早餐小厨房</span><span class="v-note-progress" id="quest-progress">0/3</span></button>
      <div class="e-desk-items">
        <button class="e-book" data-action="recipes" aria-label="打开桌上的食谱和图鉴" aria-expanded="false"><span class="e-book-pages"></span><span class="e-book-cover"><span id="recipe-art" aria-hidden="true"></span><b>食谱</b></span><span class="e-book-ribbon">图鉴</span></button>
        <button class="e-phone" data-action="phone" aria-label="打开手机，采购与设置" aria-expanded="false"><span class="e-phone-screen"><span id="phone-icon" aria-hidden="true"></span><b>手机</b></span></button>
        <button class="v-radio" id="sound-button" data-action="music" aria-label="打开收音机，调节音乐与音效"><span class="v-radio-speaker"></span><span class="v-radio-face"><i></i>音乐</span></button>
        <div class="e-assistant"><div class="k-buddy e-buddy-art" aria-hidden="true"><span class="k-chef-hat"></span><span class="k-bun"><span class="k-blush"></span></span><span class="k-apron"></span><span class="k-arm"></span></div><button class="e-assistant-face" data-action="hint" aria-label="点糯米的脸获取合成提示"><span id="hint-icon" class="screen-reader"></span></button><button class="e-parcel" data-action="rewards" aria-label="打开糯米的礼物与每日开店礼"><span id="parcel-art" aria-hidden="true"></span><span class="e-parcel-count" id="gift-count">领</span></button><span class="e-assistant-name">糯米</span></div>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="effects" class="effects" aria-hidden="true"></div>
  <dialog id="modal"><div class="modal-top"><span class="mini-label">LITTLE KITCHEN</span><button class="icon-button" id="modal-close" aria-label="关闭"></button></div><div id="modal-content"></div></dialog>
</body>
</html>
