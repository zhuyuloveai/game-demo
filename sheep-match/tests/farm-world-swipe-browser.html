<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>农场连续手势隔离验证</title><link rel="stylesheet" href="../farm-scene-world.css"><style>body{margin:0;font:13px system-ui;background:#fff8e0;height:100dvh;display:flex;flex-direction:column}body>header{padding:6px;flex:none;box-sizing:border-box}body>header button,body>header select{height:32px}#farm{flex:1;min-height:0}#qa-confirm{position:fixed;inset:25% 10% auto;z-index:2000;background:#fff5dd;border:2px solid #886d42;padding:16px}#qa-confirm[hidden]{display:none}#status{margin:3px 0;white-space:pre-wrap}#log{position:fixed;top:90px;left:80px;z-index:1000;max-width:180px;font-size:11px;pointer-events:none}</style><header><b>仅QA，不读写玩家存档</b><div><label>场景 <select id="scenario"><option value="fields">麦田</option><option value="animals">饥饿动物</option><option value="animalsReady">待收动物</option><option value="cow">牛棚</option><option value="sheep">羊圈</option><option value="fruit">果园</option><option value="factory">工坊</option></select></label></div><p id="status"></p></header><div id="farm"></div><output id="log"></output><section id="qa-confirm" hidden><p></p><button id="confirm-yes">确认</button><button id="confirm-no">取消</button></section><script type="module">
import {mountWorldScene} from '../farm-scene-world.mjs';import * as core from '../farm-core.mjs';import * as config from '../farm-config.mjs';import * as layout from '../farm-layout.mjs';import {farmAssetUrl} from '../farm-assets.mjs';
const ready=(await(await fetch('./fixtures/farm-level30-ready.json')).json()).payload,root=document.querySelector('#farm'),status=document.querySelector('#status'),log=document.querySelector('#log');let cleanup,state,subs,seq=0;
function mount(scenario){cleanup?.();subs=new Set();log.textContent='';let focusEntity,id='P01';
if(['fields','animals','animalsReady'].includes(scenario)){state=core.createFarm(0);if(scenario==='fields'){state=core.executeFarm(state,{type:'plant',entityIds:state.entities.filter(e=>e.kind==='field').map(e=>e.id),itemId:'wheat'},0).state;state=core.advanceFarm(state,120000).state;focusEntity='field_2';}else{focusEntity='shelter_chicken_1';id='P04';if(scenario==='animalsReady'){state=core.executeFarm(state,{type:'feed',entityId:focusEntity,animalIds:state.entities.find(e=>e.id===focusEntity).animals.map(a=>a.id)},state.now).state;state=core.advanceFarm(state,1200000).state;state.inventory.chicken_feed=3;}}}
else{state=structuredClone(ready);if(scenario==='fruit'){focusEntity='apple_137';id='P03';}else if(['cow','sheep'].includes(scenario)){focusEntity=state.entities.find(e=>e.kind==='shelter'&&e.configId===scenario).id;id='P04';}else {id='P05';focusEntity='bakery_112';const m=state.entities.find(e=>e.id===focusEntity);for(let i=0;i<2;i++)state=core.executeFarm(state,{type:'enqueue',entityId:m.id,recipeId:'bread'},state.now).state;state=core.advanceFarm(state,state.now+3600000).state;}}
core.assertFarm(state);
function show(){const fields=state.entities.filter(e=>e.kind==='field'),m=state.entities.find(e=>e.id===focusEntity);status.textContent=`小麦${state.inventory.wheat} 鸡饲料${state.inventory.chicken_feed} 鸡蛋${state.inventory.egg||0} 面包${state.inventory.bread||0}；熟田${fields.filter(e=>e.crop?.readyAt<=state.now).length} 在田${fields.filter(e=>e.crop).length}；${m?.kind==='shelter'?m.animals.map(a=>a.status).join('/'):m?.kind==='machine'?`待收${m.completed.length} 排队${m.queue.length}`:''}`;}
const ctx={root,id,focusEntity,core,config,layout,get state(){return state;},asset:p=>'../assets/farm/'+p,item:(id,cls='')=>`<img draggable="false" class="${cls}" src="${farmAssetUrl(id)}" alt="${config.ITEMS[id]?.name||id}">`,name:id=>config.ITEMS[id]?.name||config.BUILDINGS[id]?.name||config.RECIPES[id]?.name||id,subscribe:fn=>{subs.add(fn);return()=>subs.delete(fn)},say:text=>log.textContent=text,act(c){try{const r=core.executeFarm(state,{...c,commandId:`farmcmd:swipe:${++seq}`},state.now);state=r.state;show();for(const fn of subs)fn();return {ok:true,...r}}catch(error){log.textContent=error.message;return {ok:false,error}}},confirm:o=>{const dialog=document.querySelector('#qa-confirm');dialog.hidden=false;dialog.querySelector('p').textContent=o.title;document.querySelector('#confirm-yes').onclick=()=>{dialog.hidden=true;o.onConfirm()};document.querySelector('#confirm-no').onclick=()=>dialog.hidden=true;},openScene:id=>log.textContent='场景入口 '+id,onExit(){}};
cleanup=mountWorldScene(ctx);show();}
document.querySelector('#scenario').onchange=e=>mount(e.target.value);mount('fields');
</script></html>
