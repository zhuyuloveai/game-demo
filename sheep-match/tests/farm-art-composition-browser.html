<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牧场组合素材验收</title>
<style>body{background:#f6f2e8;color:#655a49;font:15px system-ui;margin:24px}h1{font-size:25px}.grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.card{background:white;border:1px solid #dfd8c7;border-radius:16px;padding:12px}.stage{height:230px;position:relative;background:#cadfaa;border-radius:10px;overflow:hidden}.art{position:absolute;width:90%;height:90%;left:5%;top:5%}.actor{position:absolute;left:48%;top:58%;width:22%;height:25%;z-index:1}.front{z-index:2}.bridge .actor{top:42%;left:42%}button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid #b6a084;background:#fff8e9}p{line-height:1.5}@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(140px,1fr))}}</style>
<h1>桥、拱门与花围栏 · 组合验收</h1><p>同一张原图拆成后景和前景，中间放置独立动物，检查共享画布、遮挡和镜像。下方展示花围栏的 16 种连接。</p><button id="direction">切换朝向</button><div class="grid" id="composites"></div><h2>花围栏连接组件</h2><div class="grid" id="fences"></div>
<script type="module">
import {resolveWorldArt,renderRuntimeArt} from '../farm-runtime-art.mjs';
import {resolveTerrainArt,TERRAIN_DIRECTIONS} from '../farm-runtime-terrain.mjs';
let mirror=false;
function render(){document.querySelector('#composites').innerHTML=['bridge','arch','decor_bridge','decor_flag'].map(configId=>{const a=resolveWorldArt({kind:'decoration',configId});return `<article class="card"><h3>${configId}</h3><div class="stage ${configId.includes('bridge')?'bridge':''}">${renderRuntimeArt(a,{className:'art',mirror,layer:'back'})}${renderRuntimeArt(resolveWorldArt({kind:'animal',configId:'chicken'}),{className:'actor'})}${renderRuntimeArt(a,{className:'art front',mirror,layer:'front'})}</div></article>`}).join('');}
document.querySelector('#direction').onclick=()=>{mirror=!mirror;render();};render();
document.querySelector('#fences').innerHTML=Array.from({length:16},(_,mask)=>{const e={kind:'decoration',configId:'flower_fence',x:20,y:20},neighbors=TERRAIN_DIRECTIONS.filter(d=>mask&d.bit).map(d=>({...e,x:e.x+d.dx,y:e.y+d.dy})),a=resolveTerrainArt(e,neighbors);return `<article class="card"><span>连接 ${mask.toString(16)}</span><img src="${a.src}" alt="花围栏连接 ${mask}" style="width:100%;height:120px;object-fit:contain"></article>`;}).join('');
</script></html>
