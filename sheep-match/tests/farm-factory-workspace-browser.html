<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全工厂操作区隔离验证</title>
<style>body{margin:0;background:#e8e2cd;color:#443d2d;font:13px system-ui}header{padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}header button,header select{min-height:36px}iframe{display:block;border:1px solid #8a805d;margin:0 auto;background:#c9dfaa;max-width:100%}pre{white-space:pre-wrap;max-width:860px;margin:12px auto;padding:8px;background:#fff9e8}body[data-panel=true]{height:100dvh;overflow:hidden}body[data-panel=true]>header,body[data-panel=true]>iframe,body[data-panel=true]>pre{display:none}#farm{height:100dvh}</style>
<header><strong>真实 store · 独立 QA 存档</strong><label>设施 <select id="factory"></select></label><label>状态 <select id="mode"><option value="idle">空闲</option><option value="running">生产 + 等待</option><option value="shelf9">满架 9 + 等待 9</option><option value="queue9">满队 9</option><option value="missing">缺料</option><option value="seed">最后种子确认</option><option value="barnfull">货仓满</option><option value="readonly">只读</option></select></label><label>视口 <select id="size"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option><option value="320,568">320 × 568</option><option value="844,390">844 × 390 横屏</option></select></label><button id="reset">重置场景</button><button id="reload">刷新保留</button><button id="open">重新开面板</button><button id="drag">合成 touch 拖入不松手</button><button id="sweep">合成 touch 扫成品不松手</button><button id="up">松手</button><button id="cancel">取消</button></header><iframe id="phone" title="实际 CSS 视口"></iframe><pre id="report"></pre><div id="farm"></div>
<script type="module">
import * as config from '../farm-config.mjs';
const params=new URLSearchParams(location.search),panel=params.has('panel');document.body.dataset.panel=String(panel);
if(!panel){
 const frame=document.querySelector('#phone'),factory=document.querySelector('#factory'),mode=document.querySelector('#mode'),size=document.querySelector('#size');
 for(const b of Object.values(config.BUILDINGS)){const option=document.createElement('option');option.value=b.id;option.textContent=b.name+' · '+b.id;factory.append(option);}
 function load(reset=false){const [w,h]=size.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';frame.src=`?panel=1&factory=${factory.value}&mode=${mode.value}${reset?'&reset='+Date.now():''}`;}
 for(const select of [factory,mode,size])select.onchange=()=>load();document.querySelector('#reset').onclick=()=>load(true);document.querySelector('#reload').onclick=()=>frame.contentWindow.location.reload();
 for(const action of ['open','drag','sweep','up','cancel'])document.querySelector('#'+action).onclick=()=>frame.contentWindow.postMessage({factoryQa:action},location.origin);
 addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data.factoryQaReport)document.querySelector('#report').textContent=JSON.stringify(event.data.factoryQaReport,null,2);});load();
}else{
 const [{mountFarm},save,core,{factoryFixture}]=await Promise.all([import('../farm-scene-host.mjs'),import('../farm-save.mjs'),import('../farm-core.mjs'),import('./farm-factory-fixtures.mjs')]);
 for(const name of ['farm-scene-host','farm-scene-world','farm-scene-management','farm-scene-trade','farm-delight']){const link=document.createElement('link');link.rel='stylesheet';link.href='../'+name+'.css';document.head.append(link);}
 const factory=params.get('factory')||'bakery',mode=params.get('mode')||'idle',fixture=factoryFixture(factory,mode),key='factory-workspace-qa-v1:'+factory+':'+mode,allowed=new Set(['a','b','active','draft'].map(v=>key+':'+v));let writes=0,commands=[];
 const storage={getItem(k){if(!allowed.has(k))throw Error('Unexpected QA key');return localStorage.getItem(k)},setItem(k,v){if(!allowed.has(k))throw Error('Unexpected QA key');writes++;localStorage.setItem(k,v)},removeItem(k){if(!allowed.has(k))throw Error('Unexpected QA key');localStorage.removeItem(k)}};
 if(params.has('reset')){for(const k of allowed)storage.removeItem(k);params.delete('reset');history.replaceState(null,'','?'+params);}
 if(!storage.getItem(key+':a')){storage.setItem(key+':a',JSON.stringify(save.makeEnvelope(fixture.state,{savedAtWallMs:fixture.state.now,saveId:key,commitId:'factory-fixture'})));storage.setItem(key+':active','a');}
 const store=save.createFarmStore({storage,key,locks:mode==='readonly'?{request:(_name,_opts,callback)=>Promise.resolve(callback(null))}:null,now:()=>fixture.state.now,monotonicNow:()=>0});await store.ready;
 const dispatch=store.dispatch;store.dispatch=command=>{const result=dispatch(command);commands.push({type:command.type,recipeId:command.recipeId,jobIds:command.jobIds,allowSeedReserve:command.allowSeedReserve,ok:result.ok,code:result.code||result.error?.code,events:result.delta?.events?.filter(e=>e.ok!==false).length||0});return result;};
 const root=document.querySelector('#farm'),host=mountFarm({root,store});let held=null;const open=()=>{if(!root.querySelector('.ff-backdrop'))root.querySelector(`[data-entity="${fixture.entityId}"]`)?.click();};open();
 function emit(type,target,p){target.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:901,pointerType:'touch',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:p.x,clientY:p.y}));}
 const middle=el=>{const r=el.getBoundingClientRect();return{x:r.x+r.width/2,y:r.y+r.height/2}};
 addEventListener('message',event=>{if(event.source!==parent)return;const action=event.data?.factoryQa;if(action==='open')open();else if(action==='drag'){const overlay=root.querySelector('.ff-backdrop'),recipe=overlay?.querySelector('[data-ff-recipe]'),box=overlay?.querySelector('.ff-box');if(recipe&&box){const start=middle(recipe),end=middle(box);held={overlay,p:end};emit('pointerdown',recipe,start);emit('pointermove',overlay,end);}}else if(action==='sweep'){const overlay=root.querySelector('.ff-backdrop'),targets=[...overlay?.querySelectorAll('[data-ff-collect]')||[]].map(el=>({el,p:middle(el)}));if(targets.length){held={overlay,p:targets[0].p};emit('pointerdown',targets[0].el,held.p);for(const {p} of targets){held.p=p;emit('pointermove',overlay,p);}}}else if(held&&['up','cancel'].includes(action)){emit(action==='up'?'pointerup':'pointercancel',held.overlay,held.p);held=null;}});
 function report(){const s=store.getState(),e=s.entities.find(e=>e.id===fixture.entityId),r=root.querySelector('[data-ff-recipe]'),g=root.querySelector('[data-ff-collect]'),panel=root.querySelector('.ff-panel');parent.postMessage({factoryQaReport:{factory,mode,viewport:[innerWidth,innerHeight],readOnly:store.readOnly,queue:e.queue.map(j=>({id:j.id,recipe:j.recipeId,state:j.startAt===null?'waiting':'running'})),slots:e.slots,completed:e.completed.map(j=>({id:j.id,outputs:j.outputs})),inventory:Object.fromEntries([...new Set([fixture.recipeId,...Object.keys(config.RECIPES[fixture.recipeId].inputs)])].map(id=>[id,s.inventory[id]||0])),renderedSlots:root.querySelectorAll('[data-ff-slot]').length,renderedProducts:root.querySelectorAll('[data-ff-collect]').length,renderedRecipes:root.querySelectorAll('[data-ff-recipe]').length,recipeTouch:r?getComputedStyle(r).touchAction:null,productTouch:g?getComputedStyle(g).touchAction:null,panelScroll:panel?{client:panel.clientHeight,total:panel.scrollHeight,left:panel.scrollLeft,width:panel.clientWidth,fullWidth:panel.scrollWidth}:null,status:root.querySelector('.ff-status')?.textContent,writes,commands}},location.origin);}
 setInterval(report,400);addEventListener('pagehide',()=>{host.destroy();store.close();});report();
}
</script>
