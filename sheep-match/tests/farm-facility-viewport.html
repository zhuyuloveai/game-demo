<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>设施手机视口 QA</title><style>body{margin:0;display:flex;align-items:flex-start;background:#e7e4d8;font:13px system-ui}iframe{flex:none;border:0;width:390px;height:844px;background:#fff}aside{padding:14px;width:300px}button{min-height:44px;padding:8px;margin:4px}p{line-height:1.7}</style><iframe title="设施手机CSS视口"></iframe><aside><h3>真实 CSS 视口</h3><p>云浏览器鼠标操作；合成 touch 入口在各测试页明确标注，不是原生手机。</p><button data-size="390,844">390×844</button><button data-size="360,640">360×640</button><button data-size="667,375">667×375</button><p id="size">390×844</p><div id="qa-proxy"></div><pre id="qa-output" style="white-space:pre-wrap"></pre></aside><script>const p=new URLSearchParams(location.search),frame=document.querySelector('iframe'),allowed=['trade-controls-browser.html','farm-coop-mobile-browser.html','farm-factory-mobile-browser.html','farm-mobile-regression-browser.html'];const file=allowed.includes(p.get('fixture'))?p.get('fixture'):'trade-controls-browser.html';const v=p.get('version');frame.src=(v&&/^[a-z0-9-]+$/.test(v)?'../../.qa-'+v+'/sheep-match/tests/':'')+file+'?panelOnly=1';frame.onload=()=>{const d=frame.contentDocument,proxy=document.querySelector('#qa-proxy');proxy.replaceChildren();for(const b of d.querySelectorAll('#qa-controls button,body>header button')){const clone=document.createElement('button');clone.textContent=b.textContent;clone.onclick=()=>b.click();proxy.append(clone)}setInterval(()=>{document.querySelector('#qa-output').textContent=d.querySelector('#qa-report,#report')?.textContent||'';},500);};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.querySelector('#size').textContent=w+'×'+h;});</script></html>
