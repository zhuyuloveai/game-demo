<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Instant farm tools real-store QA</title>
<style>body{margin:0;font:12px system-ui;height:100vh;display:flex;flex-direction:column}header{padding:6px;background:#fff7d7;z-index:6000}button{padding:6px;margin:2px}#farm{position:relative;flex:1;min-height:0}#report{max-height:160px;overflow:auto;white-space:pre-wrap;margin:0;background:#fff;font:11px monospace}</style>
<header>隔离 real localStorage / synthetic pointer QA（非真实手指性能）<button id="ready">48格待收</button><button id="empty">48格空田</button><button id="held">拖到一格，不松手</button><button id="sweep">扫过所有可见格，不松手</button><button id="cancel">取消触控</button><button id="up">松手</button><button id="sixready">6只待收</button><button id="sixhungry">6只待喂</button><button id="animalheld">动物单目标不松手</button><button id="animalsweep">扫6只不松手</button><button id="factorycase">工厂面板</button><button id="factoryseed">最后种子确认场景</button><button id="snapshot">读取当前结果</button><button id="reset">重载存档验证保留</button></header><div id="farm"></div><pre id="report"></pre>
<script type="module">
import {mountFarm} from '../farm-scene-host.mjs';import * as save from '../farm-save.mjs';import * as core from '../farm-core.mjs';import {growthFixture,maxPensFixture} from './farm-growth-fixtures.mjs';
for(const file of ['farm-scene-host.css','farm-scene-world.css','farm-scene-management.css','farm-scene-trade.css','farm-delight.css']){const l=document.createElement('link');l.rel='stylesheet';l.href=new URL('../'+file,import.meta.url);document.head.append(l);}
const root=document.querySelector('#farm'),report=document.querySelector('#report'),KEY='farm-tool-qa',keys=new Set(['a','b','active','draft'].map(k=>KEY+':'+k));let store,host,clock=0,mode='harvest',gesture=null,writes=0,commands=[],durations=[],longTasks=[],errors=[];
const storage={getItem(k){if(!keys.has(k))throw Error('nonQA key');return localStorage.getItem(k)},setItem(k,v){if(!keys.has(k))throw Error('nonQA key');writes++;localStorage.setItem(k,v)},removeItem(k){if(!keys.has(k))throw Error('nonQA key');localStorage.removeItem(k)}};
try{new PerformanceObserver(list=>longTasks.push(...list.getEntries().map(e=>e.duration))).observe({type:'longtask'});}catch{}
window.addEventListener('error',e=>{errors.push(e.message);show('error')});
const q=(a,p)=>a.length?[...a].sort((a,b)=>a-b)[Math.min(a.length-1,Math.floor(a.length*p))]:0;
function show(label){const s=store.getState();report.textContent=JSON.stringify({label,mode,held:!!gesture,commandCount:commands.length,successful:commands.filter(c=>c.ok&&c.events).length,eventCount:commands.reduce((a,c)=>a+c.events,0),writes,wheat:s.inventory.wheat,fields:s.entities.filter(e=>e.kind==='field').length,planted:s.entities.filter(e=>e.kind==='field'&&e.crop).length,ready:s.entities.filter(e=>e.kind==='field'&&e.crop?.readyAt<=s.now).length,animalStates:s.entities.find(e=>e.kind==='shelter'&&e.configId==='chicken')?.animals.map(a=>a.status),feed:s.inventory.chicken_feed,egg:s.inventory.egg,factory: s.entities.filter(e=>e.kind==='machine').map(e=>({id:e.id,type:e.machineType,queued:e.queue.length,completed:e.completed.length})),revision:s.revision,activeSlot:storage.getItem(KEY+':active'),handlerMs:{p95:q(durations,.95),max:q(durations,1)},longTasks:{count:longTasks.length,max:q(longTasks,1)},errors},null,2);}
function mount(){host?.destroy();store?.close();store=save.createFarmStore({storage,key:KEY,locks:null,now:()=>clock,monotonicNow:()=>performance.now()});const original=store.dispatch;store.dispatch=command=>{const r=original(command);if(['plant','harvest','feed','collectAnimal','enqueue','collectMachine','cancelJob'].includes(command.type))commands.push({type:command.type,ok:r.ok,events:r.delta?.events?.length||0});return r};host=mountFarm({root,store});gesture=null;show('mounted');}
function prepare(next){mode=next;host?.destroy();store?.close();let s=next.startsWith('animal')?maxPensFixture():growthFixture(3);if(next.startsWith('animal'))for(const a of s.entities.find(e=>e.kind==='shelter'&&e.configId==='chicken').animals){a.status=next==='animalfeed'?'hungry':'ready';a.readyAt=a.status==='hungry'?0:s.now-1;}s.camera={centerX:31.5,centerY:33.5,zoom:.75};clock=s.now;if(next==='plant'){s=core.executeFarm(s,{type:'harvest',entityIds:s.entities.filter(e=>e.kind==='field').map(e=>e.id)},s.now).state;}for(const k of keys)storage.removeItem(k);storage.setItem(KEY+':a',JSON.stringify(save.makeEnvelope(s,{savedAtWallMs:clock,saveId:KEY,commitId:'baseline'})));storage.setItem(KEY+':active','a');commands=[];durations=[];writes=0;longTasks=[];mount();}
document.querySelector('#factorycase').onclick=()=>{end('pointercancel');prepare('harvest');const e=store.getState().entities.find(e=>e.kind==='machine'&&e.machineType==='bakery');root.querySelector(`[data-entity="${e.id}"]`).click();show('factory opened');};
document.querySelector('#snapshot').onclick=()=>show('current live state');
document.querySelector('#factoryseed').onclick=()=>{end('pointercancel');host?.destroy();store?.close();const s=growthFixture(3);for(const e of s.entities)if(e.kind==='field')e.crop=null;s.inventory.wheat=3;clock=s.now;for(const k of keys)storage.removeItem(k);storage.setItem(KEY+':a',JSON.stringify(save.makeEnvelope(s,{savedAtWallMs:clock,saveId:KEY,commitId:'seed-protection'})));storage.setItem(KEY+':active','a');commands=[];durations=[];writes=0;longTasks=[];mount();const e=s.entities.find(e=>e.kind==='machine'&&e.machineType==='bakery');root.querySelector(`[data-entity="${e.id}"]`).click();show('seed protection scenario');};
document.querySelector('#sixready').onclick=()=>{prepare('animalcollect');if(new URLSearchParams(location.search).has('compact')){const e=store.getState().entities.find(e=>e.kind==='shelter'&&e.configId==='chicken');root.querySelector(`[data-entity="${e.id}"]`).click();}};document.querySelector('#sixhungry').onclick=()=>prepare('animalfeed');
async function beginAnimals(){if(gesture)return;longTasks=[];const e=store.getState().entities.find(e=>e.kind==='shelter'&&e.configId==='chicken');root.querySelector(`[data-entity="${e.id}"]`).click();await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);const game=root.querySelector('.fc-backdrop'),isFeed=mode==='animalfeed',targets=[...game.querySelectorAll(isFeed?'[data-feed-target]':'[data-egg]')].map(el=>({el,p:center(el)})),tool=isFeed?game.querySelector('.fc-feed'):targets[0].el;const old=game.setPointerCapture;game.setPointerCapture=()=>{};gesture={game,old,last:center(tool),targets};fire(tool,'pointerdown',gesture.last);}
document.querySelector('#animalheld').onclick=async()=>{try{await beginAnimals();move(gesture.targets[0].p);show('animal held before pointerup');}catch(e){errors.push(e.message);show('animal failed')}};
document.querySelector('#animalsweep').onclick=async()=>{try{await beginAnimals();for(const {p} of gesture.targets){move(p);await new Promise(requestAnimationFrame);}show('six animals held before pointerup');}catch(e){errors.push(e.message);show('animal failed')}};
function center(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2};}
function fields(){const r=root.querySelector('.fw-map').getBoundingClientRect();return [...root.querySelectorAll('[data-entity].fw-field')].map(el=>({el,p:center(el.querySelector('.fw-ground-mark'))})).filter(({p})=>p.x>r.left+20&&p.x<r.right-20&&p.y>r.top+20&&p.y<r.bottom-20);}
function fire(target,type,p){const t=performance.now();target.dispatchEvent(new PointerEvent(type,{pointerId:741,pointerType:'mouse',button:0,buttons:type==='pointerup'?0:1,clientX:p.x,clientY:p.y,bubbles:true,cancelable:true}));durations.push(performance.now()-t);}
document.addEventListener('pointerdown',e=>{if(e.target.closest('header'))e.stopImmediatePropagation();},true);
function begin(){if(gesture)return;longTasks=[];const targets=fields();if(!targets.length)throw Error('no visible fields');targets[0].el.click();const tool=root.querySelector(`[data-tool="${mode}"]`);if(!tool)throw Error('tool not visible');const game=root.querySelector('.fw-game')||root.querySelector('.fw-root');const old=game.setPointerCapture;game.setPointerCapture=()=>{};gesture={game,old,last:center(tool),targets};fire(tool,'pointerdown',gesture.last);}
function move(p){gesture.last=p;fire(gesture.game,'pointermove',p);}
document.querySelector('#ready').onclick=()=>prepare('harvest');document.querySelector('#empty').onclick=()=>prepare('plant');
document.querySelector('#held').onclick=()=>{try{begin();move(gesture.targets[0].p);show('pointer held: committed before pointerup');}catch(e){errors.push(e.message);show('failed')}};
document.querySelector('#sweep').onclick=async()=>{try{begin();for(const {p} of gesture.targets){move(p);await new Promise(requestAnimationFrame);}show('sweep held: committed before pointerup');}catch(e){errors.push(e.message);show('failed')}};
function end(type){if(gesture){const g=gesture;fire(g.game,type,g.last);g.game.setPointerCapture=g.old;gesture=null;}show(type+' preserves committed results');}
document.querySelector('#cancel').onclick=()=>end('pointercancel');document.querySelector('#up').onclick=()=>end('pointerup');document.querySelector('#reset').onclick=()=>{end('pointercancel');mount();show('reloaded durable state')};prepare('harvest');const automaticCase=new URLSearchParams(location.search).get('case');if(automaticCase)document.querySelector('#'+automaticCase)?.click();if(new URLSearchParams(location.search).has('compact')){document.querySelector('header').style.display='none';report.style.display='none';}
</script>
