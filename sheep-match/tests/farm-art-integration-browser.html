<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>农场新美术 · 正式运行时隔离验收</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../farm-scene-host.css"><link rel="stylesheet" href="../farm-scene-world.css"><link rel="stylesheet" href="../farm-scene-trade.css"><link rel="stylesheet" href="../farm-scene-management.css"><link rel="stylesheet" href="../farm-delight.css">
<style>html,body{height:100%;margin:0;overflow:hidden}body{display:block}#farm{position:absolute;inset:38px 0 0}#qa{position:fixed;top:0;left:0;right:0;height:38px;z-index:6000;background:#fff3d8;display:flex;gap:4px;font:12px system-ui;overflow:auto}#qa button{white-space:nowrap}#status{position:fixed;bottom:0;left:0;z-index:6000;max-width:100%;font:10px monospace;background:#fff9;pointer-events:none}body.compact #qa,body.compact #status{display:none}body.compact #farm{inset:0}</style>
<nav id="qa"><button data-stage="1">小农场边界</button><button data-stage="3">繁荣农场</button><button data-animal="chicken">鸡待喂</button><button data-animal="cow">牛待喂</button><button data-animal="pig">猪待喂</button><button data-animal="sheep">绵羊待喂</button><button data-animal="lamb">羔羊待喂</button><button id="reduce">减少动态</button><button id="normal">恢复动态</button><button id="report">检查资源</button></nav><main id="farm"></main><output id="status"></output>
<script type="module">
import {mountFarm} from '../farm-scene-host.mjs';import * as save from '../farm-save.mjs';import * as core from '../farm-core.mjs';import {growthFixture,maxPensFixture} from './farm-growth-fixtures.mjs';
const params=new URLSearchParams(location.search),root=document.querySelector('#farm'),status=document.querySelector('#status'),KEY='farm-art-integration-QA-only';let host,store,clock=1800000000000,errors=[],frames={},actions=[];
const storage={getItem:k=>localStorage.getItem(k),setItem:(k,v)=>{if(!k.startsWith(KEY+':'))throw Error('Non QA key');localStorage.setItem(k,v)},removeItem:k=>{if(!k.startsWith(KEY+':'))throw Error('Non QA key');localStorage.removeItem(k)}};
function report(){const imgs=[...root.querySelectorAll('img')];const data={revision:store.getState().revision,actions,frames:Object.fromEntries(Object.entries(frames).map(([k,v])=>[k,[...v].sort((a,b)=>a-b)])),brokenImages:imgs.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),errors,animated:root.querySelectorAll('[data-fw-frame-running]').length,terrain:root.querySelectorAll('.fw-forest-fringe,.fw-forest-fog').length,dialogs:[...root.querySelectorAll('[role=dialog]')].map(e=>e.getAttribute('aria-label'))};status.textContent=JSON.stringify(data);return data;}
function mount(stage=3,species=null){host?.destroy();store?.close();let s=species?maxPensFixture():growthFixture(stage);if(species){for(const e of s.entities.filter(e=>e.kind==='shelter'&&e.configId===species))for(const a of e.animals){a.status='hungry';a.readyAt=0;}}clock=s.now;for(const suffix of ['a','b','active','draft'])storage.removeItem(KEY+':'+suffix);storage.setItem(KEY+':a',JSON.stringify(save.makeEnvelope(s,{savedAtWallMs:clock,saveId:KEY,commitId:'art-baseline'})));storage.setItem(KEY+':active','a');store=save.createFarmStore({storage,key:KEY,locks:null,now:()=>clock,monotonicNow:()=>performance.now()});frames={};actions=[];const dispatch=store.dispatch;store.dispatch=c=>{const r=dispatch(c);actions.push({type:c.type,ok:r.ok,events:r.delta?.events?.length||0});queueMicrotask(report);return r;};host=mountFarm({root,store});store.subscribe(report);if(species){const e=s.entities.find(e=>e.kind==='shelter'&&e.configId===species);root.querySelector(`[data-entity="${e.id}"]`).click();}report();}
new MutationObserver(records=>{for(const rec of records){const el=rec.target.closest?.('[data-animal]');if(el?.dataset.fwFrameAction){const key=el.dataset.shelter+':'+el.dataset.animal+':'+el.dataset.fwFrameAction;(frames[key]??=new Set()).add(Number(el.dataset.fwFrame));}}}).observe(root,{subtree:true,attributes:true,attributeFilter:['data-fw-frame','data-fw-frame-action','href']});
window.addEventListener('error',e=>{errors.push(e.message);report()});window.addEventListener('unhandledrejection',e=>{errors.push(String(e.reason));report()});
for(const b of document.querySelectorAll('[data-stage]'))b.onclick=()=>mount(Number(b.dataset.stage));for(const b of document.querySelectorAll('[data-animal]'))b.onclick=()=>mount(3,b.dataset.animal);
document.querySelector('#report').onclick=report;document.querySelector('#reduce').onclick=()=>{store.dispatch({type:'setSettings',settings:{reducedMotion:true}});report()};document.querySelector('#normal').onclick=()=>{store.dispatch({type:'setSettings',settings:{reducedMotion:false}});report()};
if(params.has('compact'))document.body.classList.add('compact');mount(Number(params.get('stage')||3),params.get('species'));
</script></html>
