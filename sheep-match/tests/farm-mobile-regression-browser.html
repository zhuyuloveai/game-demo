<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm mobile interaction regression</title>
<style>body{margin:0;background:#ece5d7;font:13px system-ui;display:flex;gap:12px;align-items:flex-start}#phone{width:390px;height:700px;flex:none;position:relative;overflow:hidden;background:#aacb85}aside{width:440px;max-height:100vh;overflow:auto}button{padding:8px;margin:3px}pre{font:11px monospace;white-space:pre-wrap}h2{font-size:16px}</style><main id="phone"></main><aside><h2>隔离存档 · 手机尺寸 · 非真实手机触摸</h2><button id="hungry">6只待喂</button><button id="low">仅2份饲料</button><button id="ready">6只待收</button><button id="open">打开鸡舍</button><button id="reload">重载现有QA存档</button><button id="world">关闭鸡舍</button><button id="patch">选择田地触发局部刷新</button><button id="sweep">合成touch扫6只</button><button id="edge">合成touch连续扫到边缘</button><button id="cancel">合成touch取消</button><button id="up">合成touch松手</button><button id="clear">清计数</button><pre id="report"></pre></aside>
<script>window.addEventListener("error",e=>document.querySelector("#report").textContent="ERR "+e.message);window.addEventListener("unhandledrejection",e=>document.querySelector("#report").textContent="REJECT "+e.reason?.stack)</script><script type="module">
const params=new URLSearchParams(location.search),baseline=params.has('baseline'),version=params.get('version'),base=baseline?'../../.qa-baseline/sheep-match/':version?'../../.qa-'+version+'/sheep-match/':'../';
const [{mountFarm},save,core,{maxPensFixture}]=await Promise.all(['farm-scene-host.mjs','farm-save.mjs','farm-core.mjs','tests/farm-growth-fixtures.mjs'].map(f=>import(new URL(base+f,import.meta.url))));
for(const f of ['farm-scene-host.css','farm-scene-world.css','farm-scene-management.css','farm-scene-trade.css','farm-delight.css']){const l=document.createElement('link');l.rel='stylesheet';l.href=new URL(base+f,import.meta.url);document.head.append(l)}
const root=document.querySelector('#phone'),out=document.querySelector('#report'),key='farm-mobile-qa-'+(baseline?'before':'after');const keys=new Set(['a','b','active','draft'].map(x=>key+':'+x));
const storage={getItem(k){if(!keys.has(k))throw Error('unsafe key');return localStorage.getItem(k)},setItem(k,v){if(!keys.has(k))throw Error('unsafe key');localStorage.setItem(k,v)},removeItem(k){if(!keys.has(k))throw Error('unsafe key');localStorage.removeItem(k)}};
let store,host,clock=0,wall=Date.now(),events=[],writes=0,staticResets=0,samples=0,frameSamples=0,blankImages=0,gesture=null;
const trace=e=>{if(e.type==='pointermove'&&events.at(-1)?.type==='pointermove')events.pop();events.push({type:e.type,pointer:e.pointerType,trusted:e.isTrusted,id:e.pointerId,target:e.target.className?.baseVal??e.target.className});events=events.slice(-14)};
for(const type of ['pointerdown','pointermove','pointercancel','pointerup','lostpointercapture'])root.addEventListener(type,trace,true);
new MutationObserver(ms=>{for(const m of ms)if(m.attributeName==='href'){writes++;const holder=m.target.closest('[data-animal]');if(holder&&m.oldValue?.includes('/animal-animation')&&!m.target.getAttribute('href')?.includes('/animal-animation'))staticResets++;}}).observe(root,{subtree:true,attributes:true,attributeFilter:['href'],attributeOldValue:true});
function show(){if(!store)return;const s=store.getState(),pen=s.entities.find(e=>e.kind==='shelter'&&e.configId==='chicken');out.textContent=JSON.stringify({baseline,feed:s.inventory.chicken_feed,egg:s.inventory.egg,states:pen.animals.map(a=>a.status),revision:s.revision,feedTouch:root.querySelector('.fc-feed')?getComputedStyle(root.querySelector('.fc-feed')).touchAction:null,scroll:root.querySelector('.fc-animals')?.scrollLeft,hrefWrites:writes,staticResets,samples,frameSamples,blankImages,events},null,2)}
function mount(){host?.destroy();store?.close();wall=Date.now();store=save.createFarmStore({storage,key,locks:null,now:()=>clock+Date.now()-wall,monotonicNow:()=>performance.now()});host=mountFarm({root,store});show()}
function prepare(mode='hungry'){host?.destroy();store?.close();const s=maxPensFixture();const pen=s.entities.find(e=>e.kind==='shelter'&&e.configId==='chicken');for(const a of pen.animals){a.status=mode==='ready'?'ready':'hungry';a.readyAt=a.status==='ready'?s.now-1:0}if(mode==='low')s.inventory.chicken_feed=2;s.camera={centerX:31.5,centerY:33.5,zoom:.75};clock=s.now;for(const k of keys)storage.removeItem(k);storage.setItem(key+':a',JSON.stringify(save.makeEnvelope(s,{savedAtWallMs:clock,saveId:key,commitId:'baseline'})));storage.setItem(key+':active','a');events=[];mount()}
function open(){const p=store.getState().entities.find(e=>e.kind==='shelter'&&e.configId==='chicken');root.querySelector(`[data-entity="${p.id}"]`)?.click()}
for(const id of ['hungry','low','ready'])document.querySelector('#'+id).onclick=()=>{prepare(id);open()};document.querySelector('#open').onclick=open;document.querySelector('#reload').onclick=()=>{mount();open()};document.querySelector('#world').onclick=()=>root.querySelector('.fc-close')?.click();document.querySelector('#patch').onclick=()=>root.querySelector('.fw-field')?.click();document.querySelector('#clear').onclick=()=>{events=[];writes=staticResets=samples=frameSamples=blankImages=0;show()};
function fire(type,p,target){target.dispatchEvent(new PointerEvent(type,{pointerId:9001,pointerType:'touch',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:p.x,clientY:p.y,bubbles:true,cancelable:true}))}
document.querySelector('#sweep').onclick=()=>{const game=root.querySelector('.fc-backdrop'),bag=game?.querySelector('.fc-feed');if(!bag)return;const r=bag.getBoundingClientRect(),p={x:r.x+r.width/2,y:r.y+r.height/2};gesture={game,p};fire('pointerdown',p,bag);for(const el of game.querySelectorAll('[data-feed-target]')){const r=el.getBoundingClientRect();gesture.p={x:r.x+r.width/2,y:r.y+r.height/2};fire('pointermove',gesture.p,game)}show()};document.querySelector('#edge').onclick=()=>{const game=root.querySelector('.fc-backdrop'),bag=game?.querySelector('.fc-feed'),row=game?.querySelector('.fc-animals');if(!bag||!row)return;const r=bag.getBoundingClientRect();gesture={game,p:{x:r.x+r.width/2,y:r.y+r.height/2}};fire('pointerdown',gesture.p,bag);const rr=row.getBoundingClientRect();for(const el of game.querySelectorAll('[data-feed-target]')){const br=el.getBoundingClientRect();if(br.x+br.width/2<rr.right-25){gesture.p={x:br.x+br.width/2,y:br.y+br.height/2};fire('pointermove',gesture.p,game)}}gesture.p={x:rr.right-25,y:rr.y+65};fire('pointermove',gesture.p,game);show()};for(const [id,type]of [['cancel','pointercancel'],['up','pointerup']])document.querySelector('#'+id).onclick=()=>{if(gesture){fire(type,gesture.p,gesture.game);gesture=null}show()};
setInterval(show,400);function sample(){samples++;frameSamples+=root.querySelectorAll('[data-fw-frame-running=true]').length;blankImages+=[...root.querySelectorAll('img')].filter(i=>i.complete&&i.naturalWidth===0).length;requestAnimationFrame(sample)}requestAnimationFrame(sample);prepare();open();
</script>
