server {
    listen 80 default_server;
    server_name _;
    root /srv/overtime-arena/current;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript;

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Native ES modules must have a JavaScript MIME type with nosniff enabled.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    # Seasonal SVGs keep stable names and must refresh with every game release.
    location ^~ /assets/seasons/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    location ^~ /assets/farm/ {
        # ^~ bypasses the root .mjs regex: explicitly type all bundled farm media.
        types {
            application/javascript mjs js;
            application/json json;
            text/css css;
            text/plain md txt;
            image/svg+xml svg;
            image/png png;
            image/webp webp;
            audio/mp4 m4a;
            audio/wav wav;
        }
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    location ^~ /assets/story/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    # Farm themes and feedback use stable URLs, just like seasonal recordings.
    location ^~ /media/ {
        types { audio/mp4 m4a; audio/wav wav; }
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires -1;
    }

    # Retain the original game's asset policy for immediate rollback.
    location ~ ^/assets/index-[A-Za-z0-9_-]+\.(js|css)$ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1y;
    }

    location /assets/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 1h;
    }
}
