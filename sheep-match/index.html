<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7edce">
  <meta name="description" content="一片小牧场，四季好时光。随机可解地图、无限递进闯关，三个一组消消羊。">
  <title>羊羊牧场 · 四季消消羊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🐑%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="./fonts/ZCOOLKuaiLe-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./farm-home.css">
</head>
<body data-season="spring" data-view="home">
  <main id="farm-home" class="farm-home" aria-label="我的牧场首页"></main>
  <main class="game-card" aria-label="羊羊牧场三消游戏" hidden>
    <div class="farm-scenery" aria-hidden="true">
      <svg class="scene-top" viewBox="0 0 375 101" preserveAspectRatio="none"><image width="375" height="555" href="./assets/seasons/spring.svg"/></svg>
      <svg class="scene-field" viewBox="0 101 375 299" preserveAspectRatio="none"><image width="375" height="555" href="./assets/seasons/spring.svg"/></svg>
      <svg class="scene-bottom" viewBox="0 400 375 155" preserveAspectRatio="none"><image width="375" height="555" href="./assets/seasons/spring.svg"/></svg>
    </div>
    <header class="site-header">
      <button class="icon-button home-return" id="home-open" aria-label="返回牧场首页，保留当前牌局" title="回到牧场"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg></button>
      <div class="brand"><span id="brand-sheep"></span><h1>羊羊牧场<small id="season-name">春日牧场</small></h1></div>
      <button class="icon-button" id="music-open" aria-label="打开音乐设置" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-3v12M9 9l11-3"/><ellipse cx="6" cy="18" rx="3" ry="2.5" fill="currentColor"/><ellipse cx="17" cy="15" rx="3" ry="2.5" fill="currentColor"/></svg></button>
      <button class="icon-button menu-button" id="menu-open" aria-label="打开更多功能" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="4" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="20" cy="12" r="2"/></svg></button>
    </header>
    <div class="stage-bar">
      <button id="level-open" class="level-pill" aria-label="查看闯关路线" aria-haspopup="dialog" aria-describedby="level-label"><span id="level-name">第 1 关</span><span aria-hidden="true">⌄</span></button>
      <div class="remaining">剩余 <strong id="remaining">18</strong> 张</div>
      <button class="restart" id="restart" aria-label="随机生成新地图">↻</button>
    </div>
    <div class="play-field"><div class="board" id="board" role="group" aria-label="叠层牌区"></div></div>
    <div class="rack-area">
      <div class="rack-heading"><span>小羊收集盒 <small>三个一样，消掉啦</small></span><div class="reserve-area" id="reserve-area" hidden><span>临时草篮<small>点牌取回</small></span><div id="reserve" role="group" aria-label="临时草篮"></div></div><span id="rack-count">0 <em>/ 7</em></span></div>
      <div class="rack" id="rack" role="group" aria-label="七格暂存槽"></div>
    </div>
    <div class="tools"><button id="undo" class="tool"><span class="tool-icon"></span><span>撤回</span><b class="tool-count">3</b></button><button id="shuffle" class="tool"><span class="tool-icon"></span><span>洗牌</span><b class="tool-count">2</b></button><button id="stash" class="tool"><span class="tool-icon"></span><span>移出</span><b class="tool-count">1</b></button></div>
    <div id="generation-note" class="generation-note" role="status" hidden><span>✳</span>正在准备下一片牧场…</div>
    <div class="visually-hidden"><span id="game-hint"></span><span id="field-caption"></span></div>
  </main>
  <dialog id="drawer" aria-labelledby="drawer-title">
    <header class="drawer-header"><h2 id="drawer-title">小羊的闯关路</h2><button id="drawer-close" class="close-button" aria-label="收起面板">×</button></header>
    <section id="journey-panel" class="drawer-panel" aria-label="闯关路线">
      <p id="level-label"></p><nav class="levels" id="levels"></nav><p id="journey-record"></p><button id="continue-campaign" class="action-button primary">继续闯关 →</button><p class="quiet">春、夏、秋、冬，每过一关换个季节。</p>
    </section>
    <section id="music-panel" class="drawer-panel" aria-label="音乐与音效" hidden>
      <div class="music-player" id="music-player">
        <button class="music-toggle" id="music-toggle" aria-label="播放春日蹦蹦芽" aria-pressed="false"><span id="music-symbol" aria-hidden="true">▶</span></button>
        <div class="music-info"><strong id="music-title">春日蹦蹦芽</strong><span id="music-description">木琴 · 轻笛 · 春芽轻跳</span><span id="music-status" role="status">选牌即播放 · 随季节换曲</span></div>
        <label class="music-volume" for="music-volume"><span>背景音乐音量 <output id="music-volume-value">35%</output></span><input id="music-volume" type="range" min="0" max="100" value="35" aria-label="背景音乐音量"></label>
      </div>
      <div class="sound-row"><span>操作与消除音效<small>和背景音乐分别开关</small></span><button class="sound-toggle" id="sound" aria-label="关闭音效" aria-pressed="true"></button></div>
    </section>
    <section id="menu-panel" class="drawer-panel" aria-label="更多功能" hidden>
      <button class="menu-item" id="daily" aria-pressed="false"><span>☀ 今日牧场<small>同一天，同一张地图</small></span><span aria-hidden="true">→</span></button>
      <button class="menu-item" id="help"><span>♡ 怎么玩<small>三个一组，快乐发生</small></span><span aria-hidden="true">→</span></button>
      <div class="menu-stats"><span>本局用时 <b id="timer">00:00</b></span><span>已通关 <b id="win-count">0</b> 次</span></div><p class="quiet" id="save-label">进度自动保存</p>
    </section>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div><div id="match-announcement" class="visually-hidden" role="status" aria-live="polite"></div>
  <audio id="background-music" preload="none" loop hidden></audio>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-inner"><button class="close-button modal-close" id="modal-close" aria-label="关闭弹窗">×</button><div class="modal-art" id="modal-art"></div><span class="modal-eyebrow" id="modal-eyebrow"></span><h2 id="modal-title"></h2><div id="modal-content"></div><div class="modal-actions" id="modal-actions"></div></div></dialog>
  <script type="module" src="./app.mjs"></script>
</body></html>
