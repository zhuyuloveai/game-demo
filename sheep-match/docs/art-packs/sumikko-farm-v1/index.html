<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羊羊牧场 · 63张素材集</title>
<style>
:root{font-family:"PingFang SC","Microsoft Yahei",sans-serif;color:#716049;background:#f7f4eb;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1480px;padding:28px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:2px;color:#a3967e}h1{font-size:26px;font-weight:650;margin:8px 0}header p{font-size:13px;line-height:1.8;margin:0;color:#9b8d76}.status{background:#ebefd7;color:#788b56;border:1px solid #dbe1c0;border-radius:30px;font-size:13px;padding:10px 16px;white-space:nowrap}.toolbar{display:flex;justify-content:space-between;gap:13px;flex-wrap:wrap;position:sticky;top:0;z-index:3;background:#f7f4ebef;backdrop-filter:blur(8px);padding:12px 0;margin-bottom:10px}nav,.backgrounds{display:flex;align-items:center;gap:4px;flex-wrap:wrap}button,a{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}nav button,.backgrounds button{font-size:12px;padding:8px 11px;border-radius:10px;color:#998a70}button[aria-pressed=true]{background:#e5ebcd;color:#65764b;font-weight:600}.backgrounds{font-size:11px;color:#a3937a}.backgrounds button{padding:7px 10px;font-size:11px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card{padding:0;min-width:0;text-align:left;border:1px solid #e6dfcc;border-radius:16px;background:#fffdf5;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-3px)}.picture{height:200px;padding:15px;background:var(--swatch,#c2d99b);display:flex;justify-content:center;align-items:center}.picture img{width:100%;height:100%;object-fit:contain}.label{display:flex;justify-content:space-between;gap:5px;align-items:center;padding:12px 13px 6px}.label b{font-size:13px;font-weight:500}.label small{font-size:10px;color:#a99b82}.card p{font-size:10px;color:#a99b82;margin:0 13px 13px}.grass{--swatch:#c2d99b}.paper{--swatch:#f3efd9}.checker .picture,.checker .detail-art{background-color:#fff;background-image:conic-gradient(#e8e7df 25%,transparent 0 50%,#e8e7df 0 75%,transparent 0);background-size:20px 20px}.hint{font-size:11px;line-height:1.8;color:#a3977f;margin:14px 2px 20px}footer{border-top:1px solid #e6dfcc;padding-top:16px;margin-top:26px;color:#a29680;font-size:11px;line-height:1.9}a{color:#7f925e;text-decoration:none}dialog{padding:0;border:1px solid #ddd4bd;border-radius:20px;width:min(700px,95vw);color:#79664e;background:#fffcf4;box-shadow:0 30px 90px #30231250}dialog::backdrop{background:#413b3080;backdrop-filter:blur(3px)}.detail-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-size:15px}.detail-head button{background:#eee9da;border-radius:50%;width:30px;height:30px}.detail-art{height:min(65dvh,580px);background:var(--swatch,#c2d99b);padding:20px}.detail-art img{height:100%;width:100%;object-fit:contain}.detail-footer{display:flex;justify-content:space-between;padding:14px 20px;font-size:12px;color:#9f927c}.empty{padding:60px;text-align:center;color:#a99b82;grid-column:1/-1}.count{font-size:11px;color:#a29781;margin-bottom:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.picture{height:175px}}@media(max-width:800px){.grid{grid-template-columns:repeat(3,1fr)}main{padding:22px 15px}.picture{height:170px}.toolbar{position:static}}@media(max-width:530px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}main{padding:18px 10px}header{display:block}h1{font-size:23px}header p{font-size:12px}.status{display:inline-block;font-size:11px;padding:7px 11px;margin-top:12px}.picture{height:155px;padding:8px}.label{padding:11px 11px 5px}.label b{font-size:12px}.label small{font-size:9px}.card p{margin:0 11px 11px;font-size:9px}.toolbar{gap:8px}nav button{padding:7px 9px;font-size:11px}.detail-art{height:55dvh}}
</style>
<main class="grass" id="gallery"><header><div><div class="eyebrow">羊羊牧场 / SUMIKKO FARM ART PACK 01</div><h1>牧场的 63 个小物件</h1><p>参考《角落生物农场》的造型与配色，制作独立透明底素材。</p></div><div class="status" id="status">正在读取素材…</div></header>
<div class="toolbar"><nav aria-label="素材分类" id="filters"></nav><div class="backgrounds"><span>底色</span><button data-bg="grass" aria-pressed="true">草地</button><button data-bg="paper" aria-pressed="false">奶油</button><button data-bg="checker" aria-pressed="false">透明</button></div></div><div class="count" id="count"></div><section class="grid" id="grid" aria-label="素材列表"></section><p class="hint" id="hint">点击任意素材可放大查看、下载原图。</p><footer>当前为基础静态 PNG，尚未包含生长阶段、动作帧和 SVG 重绘。<br><a href="manifest.json" target="_blank">完整清单与提示词 ↗</a> · <a href="assets.zip" download id="zip" hidden>下载整包 PNG ↓</a></footer></main>
<dialog id="detail" class="grass"><div class="detail-head"><span id="detail-title"></span><button id="close" aria-label="关闭">×</button></div><div class="detail-art"><img id="detail-image" alt=""></div><div class="detail-footer"><span id="detail-meta">透明底 PNG</span><a id="download" download>下载原图 ↓</a></div></dialog>
<script>
const names={all:'全部',buildings:'建筑设施',crops:'农作物','fruit-plants':'果树浆果',animals:'动物',decor:'装饰'};let records=[],selected='all',fingerprint='',bg='grass';const gallery=document.querySelector('#gallery'),grid=document.querySelector('#grid'),filters=document.querySelector('#filters'),detail=document.querySelector('#detail');
function render(){filters.replaceChildren();Object.entries(names).forEach(([key,label])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(selected===key));b.addEventListener('click',()=>{selected=key;render()});filters.append(b)});const visible=records.filter(a=>a.exists&&(selected==='all'||a.group===selected));document.querySelector('#count').textContent=`${names[selected]} · ${visible.length} 张`;grid.replaceChildren();visible.forEach(a=>{const card=document.createElement('button');card.className='card';card.setAttribute('aria-label','查看'+a.label);const picture=document.createElement('div');picture.className='picture';const img=document.createElement('img');img.src=a.path;img.alt=a.label;img.loading='lazy';picture.append(img);const label=document.createElement('div');label.className='label';const title=document.createElement('b');title.textContent=a.label;const small=document.createElement('small');small.textContent=a.status==='reused'?'已复用':'新生成';label.append(title,small);const sub=document.createElement('p');sub.textContent=a.projectId;card.append(picture,label,sub);card.addEventListener('click',()=>{document.querySelector('#detail-title').textContent=a.label;document.querySelector('#detail-image').src=a.path;document.querySelector('#detail-image').alt=a.label;document.querySelector('#download').href=a.path;detail.showModal()});grid.append(card)});if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='这一类正在准备中';grid.append(e)}}
async function refresh(){try{const m=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json());const key=m.assets.map(a=>a.key+':'+a.exists+':'+a.path).join('|');const ready=m.assets.filter(a=>a.exists).length;document.querySelector('#status').textContent=`已完成 ${ready} / ${m.assets.length}`;document.querySelector('#hint').textContent=ready===m.assets.length?'已全部生成。点击素材可放大查看、下载原图。':'素材正在逐批补齐，本页会自动更新。点击已完成的素材可查看原图。';if(key!==fingerprint){records=m.assets;fingerprint=key;render()}if(ready===m.assets.length){document.querySelector('#zip').hidden=false;clearInterval(refreshTimer)}}catch(e){document.querySelector('#status').textContent='读取失败，请刷新页面'}}
document.querySelectorAll('[data-bg]').forEach(b=>b.addEventListener('click',()=>{bg=b.dataset.bg;gallery.className=detail.className=bg;document.querySelectorAll('[data-bg]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));document.querySelector('#close').addEventListener('click',()=>detail.close());detail.addEventListener('click',e=>{if(e.target===detail){const r=detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)detail.close()}});const refreshTimer=setInterval(refresh,15000);refresh();
</script></html>
