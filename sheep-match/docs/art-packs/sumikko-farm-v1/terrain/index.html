<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>羊羊牧场 · 地形组件</title>
<style>
:root{font-family:"Yuanti SC","PingFang SC",system-ui,sans-serif;color:#776d55;background:#f7f4e9}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:30px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:27px;margin:7px 0;letter-spacing:2px}h2{font-size:18px;margin:28px 0 14px}p{font-size:13px;line-height:1.8;color:#968b74;margin:6px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#a59a83}a{color:#7a915e;text-decoration:none}.links{display:flex;gap:14px;font-size:12px;flex-wrap:wrap}.demo{border:1px solid #dce3c4;border-radius:22px;background:#c6dea4;overflow:hidden}.toolbar{display:flex;align-items:center;gap:8px;padding:14px 18px;background:#fffbedf2;flex-wrap:wrap;font-size:12px}button,select{font:inherit;color:inherit;border:1px solid #dedcc5;background:#fffdf3;border-radius:10px;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#e2ebca;border-color:#b9cd96;color:#61784a}button:focus-visible,a:focus-visible{outline:3px solid #8cae6d;outline-offset:3px}.toolbar span{margin-left:auto;font-size:11px;color:#9a947d}#map{width:100%;height:auto;display:block;touch-action:manipulation}#map [data-cell]{cursor:crosshair}#map [data-cell]:hover{fill:#fff8d7;fill-opacity:.35;stroke:#a8ba86}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.tile{border:1px solid #e4ddc8;border-radius:14px;background:#fffcf3;overflow:hidden;text-align:center}.tile .art{height:115px;background:#c6dea4;display:grid;place-items:center}.tile img{width:105px;max-height:105px;object-fit:contain}.tile figcaption{font-size:11px;line-height:1.7;padding:8px}.tile small{display:block;color:#a39982;font-size:9px}figure{margin:0}.fields{grid-template-columns:repeat(3,1fr);max-width:560px}.footer{margin:25px 0;padding:15px 0;border-top:1px solid #e0dac7;font-size:12px;color:#9a907b}.status{color:#7a8c5e;font-size:12px}#map-status{padding:10px 18px;background:#fffbedda;font-size:11px;color:#858d6c}@media(max-width:700px){main{padding:22px 12px}header{display:block}.links{margin-top:12px}.grid{grid-template-columns:repeat(4,1fr)}.fields{grid-template-columns:repeat(3,1fr)}h1{font-size:23px}.toolbar{padding:12px;gap:6px}.toolbar span{width:100%;margin:3px 0}.tile .art{height:95px}.tile img{width:90px}.demo{border-radius:16px}}
</style></head><body><main><header><div><span class="eyebrow">YANGYANG FARM / TERRAIN KIT</span><h1>小路连成了牧场</h1><p>16 种道路 · 16 种围栏 · 3 种田地，统一斜向网格和落地锚点。</p></div><nav class="links"><a href="../plant-states/">植物生长图鉴 ↗</a><a href="../scene/">完整小场景 ↗</a><a href="manifest.json">资源清单 ↗</a></nav></header>
<section class="demo"><div class="toolbar"><button data-tool="road" aria-pressed="true">铺路</button><button data-tool="fence" aria-pressed="false">围栏</button><button data-tool="field" aria-pressed="false">田地</button><button data-tool="erase" aria-pressed="false">移除</button><select id="field-state" aria-label="田地状态"><option value="empty">空田</option><option value="sown">已播种</option><option value="fertilized">已施肥</option></select><button id="reset">恢复示例</button><span>点一下格子，观察连接处自动变化</span></div><svg id="map" viewBox="0 0 920 490" xmlns="http://www.w3.org/2000/svg" aria-label="可编辑的道路围栏和田地拼接示例"></svg><div id="map-status" role="status"></div></section>
<h2>道路连接</h2><div id="roads" class="grid"></div><h2>围栏连接</h2><div id="fences" class="grid"></div><h2>田地状态</h2><div id="fields" class="grid fields"></div><p class="footer">路段会根据四个方向的邻居自动选型。围栏的立柱和横杆分别按深度排序，可以与动物和建筑交错遮挡。此页编辑仅用于预览。</p></main><script type="module" src="preview.mjs"></script></body></html>
