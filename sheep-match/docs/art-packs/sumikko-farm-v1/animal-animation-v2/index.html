<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牧场动作 · 第二批</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3efdf;color:#725642;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:5px 0}p{margin:8px 0 18px}.kicker{color:#789465;font-size:13px;font-weight:700;letter-spacing:.12em}a{color:#647c4d}header{margin-bottom:24px}.toolbar{position:sticky;top:0;z-index:2;background:#fff8e9f5;border:1px solid #dfceb7;border-radius:16px;padding:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 5px 15px #69554110}button,select{font:inherit;color:inherit;border:1px solid #bfa382;border-radius:10px;padding:6px 14px;background:#e6edcf;cursor:pointer}input[type=range]{width:150px;accent-color:#789465}label{display:flex;gap:6px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:24px}.card{background:#fffaf0;border:1px solid #deccb5;border-radius:20px;padding:18px;overflow:hidden}.card h2{margin:0 0 8px;font-size:19px}.stage{border-radius:12px;background:repeating-conic-gradient(#ecebdc 0% 25%,#f4f2e5 0% 50%) 0 0/20px 20px;display:flex;justify-content:center}.stage canvas{width:100%;max-width:360px;height:auto;aspect-ratio:360/280}.details{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px}.compare{display:none;width:100%;margin-top:12px;border-radius:10px}.show-reference .compare{display:block}.note{font-size:13px;color:#8b7865}footer{margin-top:28px;padding:20px;border-top:1px solid #dfceb7}@media(max-width:620px){main{padding:20px 12px}.grid{grid-template-columns:1fr;gap:14px}.toolbar{gap:10px;font-size:14px}h1{font-size:26px}}
</style><main><header><div class="kicker">YANGYANG FARM · ART LIBRARY</div><h1>小动物，动起来</h1><p>牛、猪、绵羊、羊羔 · 8 段动作 · 96 个透明帧<br>延续现有动物样貌，吃东西与原地迈步分别交付。</p><a href="../../farm-priority-icons-v1/">查看 67 个物品与操作图标 →</a></header>
<div class="toolbar"><button id="play">暂停</button><button id="step">下一帧</button><label>帧 <input id="frame" type="range" min="0" max="11" value="0"><output id="counter">00 / 11</output></label><label><input id="shadow" type="checkbox" checked>独立阴影</label><label><input id="guides" type="checkbox">脚点标注</label><label><input id="references" type="checkbox">原状态对照</label><label>速度<select id="speed"><option value="12">12 帧 / 秒</option><option value="6">6 帧 / 秒</option></select></label></div>
<div class="grid" id="grid"><p>正在加载动作帧…</p></div><footer><p>吃东西在游戏中建议播放一次，再由逻辑切换状态；本页为观察接缝循环播放。走路为原地步态，位置移动由游戏代码控制。</p><p class="note">画布 360×280，根锚点 (180,230)。红点是可见蹄尖，抬脚帧中的红点不等于承重脚。绿十字是根锚点。建议步幅详见各物种 manifest，接入时需配合实际速度校准。</p><a href="README.md">交付说明</a> · <a href="manifest.json">资源清单</a> · <a href="qa-report.json">检查结果</a></footer></main>
<script>
const species={cow:'奶牛',pig:'小猪',sheep:'绵羊',lamb:'羊羔'}, actions={eat:'吃东西',walk:'短走路'};
const els=Object.fromEntries(['play','step','frame','counter','shadow','guides','references','speed','grid'].map(id=>[id,document.getElementById(id)]));
const cards=[];let playing=true,index=0,last=0;
function image(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(src));im.src=src})}
function draw(){els.frame.value=index;els.counter.value=`${String(index).padStart(2,'0')} / 11`;for(const c of cards){const ctx=c.canvas.getContext('2d');ctx.clearRect(0,0,360,280);if(els.shadow.checked)ctx.drawImage(c.shadow,0,0);ctx.drawImage(c.frames[index],0,0);if(els.guides.checked){ctx.strokeStyle='#507958';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,230);ctx.lineTo(360,230);ctx.moveTo(174,230);ctx.lineTo(186,230);ctx.moveTo(180,224);ctx.lineTo(180,236);ctx.stroke();ctx.fillStyle='#b65951';for(const [x,y]of c.records[index].visibleHoofTips){ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}c.canvas.dataset.frame=index}}
els.play.onclick=()=>{playing=!playing;els.play.textContent=playing?'暂停':'播放';last=0};els.step.onclick=()=>{playing=false;els.play.textContent='播放';index=(index+1)%12;draw()};els.frame.oninput=()=>{playing=false;els.play.textContent='播放';index=+els.frame.value;draw()};els.shadow.onchange=els.guides.onchange=draw;els.references.onchange=()=>document.body.classList.toggle('show-reference',els.references.checked);
async function start(){els.grid.innerHTML='';for(const [sp,name]of Object.entries(species)){const manifest=await fetch(`${sp}/manifest.json`).then(r=>r.json());const shadow=await image(`${sp}/${manifest.groundShadow}`);for(const[action,label]of Object.entries(actions)){const a=manifest.actions[action];const frames=await Promise.all(a.frames.map(f=>image(`${sp}/${f.file}`)));const el=document.createElement('article');el.className='card';el.innerHTML=`<h2>${name} · ${label}</h2><div class="stage"><canvas width="360" height="280" aria-label="${name}${label}动画"></canvas></div><div class="details"><span>12 帧 · 1 秒</span><a href="${sp}/previews/${action}-contact-sheet.png">逐帧联系图</a><a href="${sp}/${a.atlas}">透明图集</a><a href="${sp}/${a.editableSource}">可编辑 ORA</a></div><img class="compare" src="${sp}/previews/reference-comparison.png" alt="${name}原静态状态与新动作对照">`;els.grid.append(el);cards.push({canvas:el.querySelector('canvas'),frames,shadow,records:a.frames})}draw()}document.body.dataset.ready='true';requestAnimationFrame(tick)}
function tick(time){const interval=1000/+els.speed.value;if(playing&&time-last>=interval){index=(index+1)%12;last=time;draw()}requestAnimationFrame(tick)}start().catch(error=>{els.grid.textContent=`资源加载失败：${error.message}`;console.error(error)});
</script></html>
