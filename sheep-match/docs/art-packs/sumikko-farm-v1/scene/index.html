<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d7e6b2">
  <title>羊羊牧场 · 完整小场景</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="farm" aria-label="小牧场场景预览">
    <div id="viewport" tabindex="0" aria-label="牧场画面，可拖动、双指缩放，用方向键移动">
      <svg id="scene" viewBox="0 0 1600 1030" xmlns="http://www.w3.org/2000/svg" aria-label="房舍、菜地、果园和动物围场组成的小牧场"></svg>
    </div>
    <header class="topbar">
      <div class="title-card">
        <svg class="sheep-mark" viewBox="0 0 52 52" aria-hidden="true"><path d="M12 19C6 12 16 7 22 11C26 3 36 7 36 13C46 10 51 21 43 26C50 34 42 43 35 39C29 46 20 44 18 38C9 42 2 32 9 27C5 24 6 20 12 19Z" fill="#fff9e9" stroke="#a28d6c" stroke-width="2"/><ellipse cx="26" cy="28" rx="13" ry="12" fill="#ebcfab"/><circle cx="22" cy="27" r="1.7" fill="#796b55"/><circle cx="31" cy="27" r="1.7" fill="#796b55"/><path d="M24 32Q26 34 29 32" fill="none" stroke="#796b55" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div><h1>羊羊牧场<span>小场景 / 01</span></h1><p>房舍 · 田野 · 小动物</p></div>
      </div>
      <div class="top-actions">
        <button id="export" class="round-button" aria-label="保存场景图"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3V14M8 10L12 14L16 10M5 15V20H19V15"/></svg></button>
        <span class="season"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2V4M12 20V22M2 12H4M20 12H22M5 5L6.5 6.5M17.5 17.5L19 19M5 19L6.5 17.5M17.5 6.5L19 5"/></svg>春日晴天</span>
        <button id="motion" class="round-button" aria-label="暂停场景动态" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5V19M15 5V19"/></svg></button>
      </div>
    </header>
    <footer class="bottom-bar">
      <div class="view-controls" aria-label="场景显示">
        <button id="overview" class="active" aria-pressed="true">全景</button>
        <button id="closeup" aria-pressed="false">近看</button>
        <span class="separator"></span>
        <button id="layout" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 8 4-8 4-8-4Zm-8 8 8 4 8-4M2 14l8 4 8-4"/></svg>布局线</button>
      </div>
      <p class="hint"><span></span>拖动逛逛，也可以点点小动物</p>
      <div class="zoom-controls"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value" aria-live="polite">100%</output><button id="zoom-in" aria-label="放大">+</button><button id="reset" aria-label="回到全景"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3H7M13 3H17V7M17 13V17H13M7 17H3V13"/></svg></button></div>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="loading"><div class="loading-sheep">☁</div><span>把小牧场收拾好…</span></div>
  </main>
  <script type="module" src="scene.js"></script>
</body>
</html>
