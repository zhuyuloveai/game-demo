<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>牧场物品与操作图标</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3efdf;color:#725642;font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:5px 0}p{margin:8px 0 18px}.kicker{color:#789465;font-size:13px;font-weight:700;letter-spacing:.12em}a{color:#647c4d}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 0;position:sticky;top:0;background:#f3efdf;z-index:1}button,select{font:inherit;color:inherit;border:1px solid #bfa382;border-radius:10px;padding:6px 14px;background:#fff8e9;cursor:pointer}button.active{background:#dce7c6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-top:12px}.card{text-align:center;background:#fffaf0;border:1px solid #deccb5;border-radius:16px;padding:14px 8px;min-width:0}.art{height:108px;display:flex;align-items:center;justify-content:center}.art img{width:var(--icon-size,80px);height:var(--icon-size,80px)}.name{font-size:14px}.id{font-size:10px;color:#95816c;overflow-wrap:anywhere}.links{font-size:12px;display:flex;justify-content:center;gap:12px;margin-top:8px}footer{margin-top:28px;padding-top:20px;border-top:1px solid #dfceb7;font-size:14px}@media(max-width:500px){main{padding:20px 12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{padding:8px 4px}.art{height:90px}h1{font-size:25px}button,select{font-size:14px;padding:5px 9px}}
</style><main><div class="kicker">YANGYANG FARM · ART LIBRARY</div><h1>篮子里，都是小日常</h1><p>26 个高频物品 · 35 个操作图标 · 6 个专用工具<br>暖色描边、柔和配色，可编辑 SVG 与透明 PNG 配套交付。</p><a href="../sumikko-farm-v1/animal-animation-v2/">查看四种动物的新动作 →</a><div class="toolbar"><button class="active" data-category="all">全部 67</button><button data-category="items">物品 26</button><button data-category="ui">操作 35</button><button data-category="tools">工具 6</button><select id="size" aria-label="图标显示尺寸"><option value="80">80 px · 细节</option><option value="48">48 px · 菜单</option><option value="32">32 px · 紧凑</option></select></div><div class="grid" id="grid"></div><footer><p>只提供独立图标，数量、价格、倒计时和按钮状态由代码显示。镰刀、种子袋和饲料袋使用别名复用。</p><a href="README.md">交付说明</a> · <a href="manifest.json">完整清单与旧文件映射</a> · <a href="previews/contact-sheet.png">总览图</a> · <a href="previews/small-size.png">小尺寸检查图</a></footer></main><script>
let icons=[],category='all';const grid=document.querySelector('#grid');function render(){grid.innerHTML=icons.filter(i=>category==='all'||i.category===category).map(i=>`<article class="card"><div class="art"><img src="${i.svg}" alt="${i.name}" width="80" height="80"></div><div class="name">${i.name}</div><div class="id">${i.id}</div><div class="links"><a href="${i.svg}">SVG</a><a href="${i.png}">PNG</a></div></article>`).join('')}document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('active',b===button));render()});document.querySelector('#size').onchange=e=>document.documentElement.style.setProperty('--icon-size',e.target.value+'px');fetch('manifest.json').then(r=>r.json()).then(m=>{icons=m.icons;render();document.body.dataset.ready='true'}).catch(error=>grid.textContent=error.message);
</script></html>
