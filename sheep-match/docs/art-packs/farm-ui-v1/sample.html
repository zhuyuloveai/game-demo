<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>面包房 · UI 美术样板</title><link rel="stylesheet" href="source/sample.css?rev=farm-v2"></head><body>
<main class="farm-stage" aria-label="生产面板美术组合样板"><img class="farm-context" data-export-image src="evidence/farm-context-wide.png" alt="当前 main 农场画面参考">
<section class="production-panel" role="region" aria-label="面包房生产面板"><i class="skin panel-skin" data-art="panel-default"></i>
<i class="canopy-art" data-art="canopy-default" aria-hidden="true"></i>
<header class="panel-head"><div class="facility-icon"><img data-export-image src="reused/bakery.png" alt="复用现有面包房素材"></div><div class="facility-title"><i class="skin" data-art="title-default"></i><h1 data-export-text>面包房</h1><span data-export-text class="subtitle">选个配方，慢慢烤好</span></div><button class="close" aria-label="关闭面包房"><i class="skin" data-art="close-default"></i></button></header>
<div class="panel-body">
<div class="recipe-heading"><h2 class="recipe-label"><img data-export-image src="reused/wheat.svg" alt=""><span data-export-text>想做点什么？</span></h2><div class="tabs" role="tablist" aria-label="配方筛选"><button role="tab" aria-selected="true" data-filter="all"><i class="skin" data-art="tab-selected"></i><span data-export-text>全部</span></button><button role="tab" aria-selected="false" data-filter="available"><i class="skin" data-art="tab-default"></i><span data-export-text>可以做</span></button></div></div>
<div class="recipe-list" role="group" aria-label="配方选择"></div>
<section class="recipe-detail"><i class="skin" data-art="well-default"></i><div class="detail-top"><h3 data-export-text class="selected-name">玉米面包</h3><div class="recipe-meta"><img data-export-image src="components/symbol-clock.svg" alt=""><span data-export-text class="duration">30 分钟</span><span data-export-text class="yield">· 产出 1 份</span></div></div><div class="ingredient-row"></div><div class="material-note" hidden><img data-export-image src="components/symbol-warning.svg" alt=""><span data-export-text></span><button class="text-button" data-action="source"><span data-export-text>去获取</span><img data-export-image src="components/symbol-arrow.svg" alt=""></button></div></section>
<section class="queue-section" aria-label="生产队列"><div class="section-heading"><h2 data-export-text>生产队列</h2><span data-export-text class="quiet">2 / 3 槽位</span></div><div class="queue-grid">
<div class="queue-cell running"><i class="skin" data-art="queue-slot-running"></i><img class="queue-product" data-export-image src="reused/bread.svg" alt="制作中的面包"><span class="queue-state" data-export-text>制作中</span><span class="queue-time" data-export-text>02:24</span><div class="meter"><i class="skin" data-art="progress-track"></i><i class="skin meter-fill" data-art="progress-fill"></i></div></div>
<div class="queue-cell"><i class="skin" data-art="queue-slot-waiting"></i><img class="queue-product" data-export-image src="reused/corn_bread.svg" alt="等待的玉米面包"><span class="queue-state" data-export-text>等待中</span><span class="queue-time" data-export-text>第 2 份</span></div>
<button class="queue-cell empty" aria-label="空生产槽"><i class="skin" data-art="queue-slot-empty"></i><img class="queue-symbol" data-export-image src="components/symbol-plus.svg" alt=""><span class="queue-state" data-export-text>空槽</span><span class="queue-time" data-export-text>可放入配方</span></button>
<button class="queue-cell locked" aria-label="尚未解锁的生产槽"><i class="skin" data-art="queue-slot-locked"></i><img class="queue-symbol" data-export-image src="components/symbol-lock.svg" alt=""><span class="queue-state" data-export-text>未解锁</span><span class="queue-time" data-export-text>查看条件</span></button>
</div></section>
<div class="completion"><i class="skin" data-art="notice-info"></i><img data-export-image src="components/symbol-complete.svg" alt=""><span data-export-text class="complete-label">烤好啦</span><img data-export-image class="completed-product" src="reused/bread.svg" alt="已完成的面包"><span data-export-text>× 1</span><button class="text-button" data-action="collect"><span data-export-text>领取</span><img data-export-image src="components/symbol-arrow.svg" alt=""></button></div>
<div class="storage-notice" hidden><i class="skin" data-art="notice-full"></i><img data-export-image src="components/symbol-warning.svg" alt=""><div><strong data-export-text>货仓满了，成品先留在这里</strong><span data-export-text>腾出空间后再领取，不会丢失。</span></div><button class="text-button" data-action="warehouse"><span data-export-text>去仓库</span></button></div>
</div>
<footer class="panel-foot"><div class="foot-note"><span class="primary-note" data-export-text>材料齐了</span><span class="secondary-note" data-export-text>加入队列后依次制作</span></div><button class="primary action-button" data-action="produce"><i class="skin" data-art="button-primary-default"></i><span data-export-text>加入队列</span><img data-export-image src="components/symbol-arrow.svg" alt=""></button></footer>
</section><button class="reopen" hidden><i class="skin" data-art="button-primary-default"></i><span data-export-text>打开面包房</span></button></main>
<div class="review-feedback" aria-live="polite"></div><script src="source/sample.js?rev=farm-v2"></script></body></html>
