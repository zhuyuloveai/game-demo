<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>绿野农场 · Canvas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #050f08; }
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      color: #b8e0a8;
    }
    #app { display: flex; width: 100%; height: 100vh; }
    /* 侧边面板 */
    .panel {
      flex: 1;
      min-width: 0;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }
    .card {
      background: rgba(140, 220, 120, 0.05);
      border: 1px solid rgba(140, 220, 120, 0.16);
      border-radius: 10px;
      padding: 16px;
    }
    .card h3 {
      font-size: 12px;
      letter-spacing: 2px;
      color: #7cb86a;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #d9f5c4;
      text-shadow: 0 0 12px rgba(140, 220, 120, 0.45);
    }
    .subtitle { font-size: 11px; letter-spacing: 4px; color: #7cb86a; margin-top: 4px; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; }
    .stat-row .label { font-size: 12px; color: #8fb882; letter-spacing: 1px; }
    .stat-row .val {
      font-size: 20px;
      font-weight: 700;
      color: #d9f5c4;
      text-shadow: 0 0 8px rgba(140, 220, 120, 0.4);
    }
    .muted { font-size: 12px; color: #8fb882; line-height: 1.9; }
    .key {
      display: inline-block;
      padding: 1px 7px;
      border: 1px solid rgba(140, 220, 120, 0.3);
      border-radius: 4px;
      font-size: 11px;
      color: #c9e8a8;
      background: rgba(140, 220, 120, 0.06);
    }
    .logo {
      font-size: 44px;
      text-align: center;
      filter: drop-shadow(0 0 10px rgba(140, 220, 120, 0.5));
    }
    /* 中间农场 */
    #stage {
      flex: 1;
      min-width: 0;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(140, 220, 120, 0.15);
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #12230f;
      touch-action: none;
    }
    .corner {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(140, 220, 120, 0.5);
      pointer-events: none;
    }
    .corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }
    .footnote { margin-top: auto; font-size: 11px; color: #4a6e42; text-align: center; }
    /* 作物选择按钮 */
    .crop-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 8px;
      border: 1px solid rgba(140, 220, 120, 0.18);
      border-radius: 8px;
      background: rgba(140, 220, 120, 0.05);
      color: #c9e8a8;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
    }
    .crop-btn:last-child { margin-bottom: 0; }
    .crop-btn:hover { border-color: rgba(140, 220, 120, 0.45); }
    .crop-btn.active {
      border-color: #a5e878;
      background: rgba(140, 220, 120, 0.14);
      box-shadow: 0 0 10px rgba(140, 220, 120, 0.18);
    }
    .crop-btn .crop-emoji { font-size: 26px; line-height: 1; }
    .crop-btn .crop-name { font-size: 14px; font-weight: 600; }
    .crop-btn .crop-meta { margin-left: auto; font-size: 11px; color: #8fb882; white-space: nowrap; }
    .crop-btn.active .crop-meta { color: #b8e0a8; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 左侧 -->
    <aside class="panel">
      <div>
        <div class="title">绿野农场</div>
        <div class="subtitle">MINI FARM</div>
      </div>
      <div class="card">
        <div class="logo">🌾</div>
        <div class="muted" style="text-align:center; margin-top:6px;">田园种地 · 开心经营</div>
      </div>
      <div class="card">
        <h3>金币</h3>
        <div class="stat-row"><span class="label">COINS</span><span class="val" id="coins">0</span></div>
      </div>
      <div class="card">
        <h3>经营统计</h3>
        <div class="stat-row"><span class="label">已收获</span><span class="val" id="harvested">0 株</span></div>
        <div class="stat-row"><span class="label">总收入</span><span class="val" id="earned">0</span></div>
      </div>
      <div class="card">
        <h3>操作说明</h3>
        <div class="muted">
          点击 <span class="key">空地</span> 种植所选作物<br />
          点击 <span class="key">成熟作物</span> 收获换金币<br />
          <span class="key">1</span>/<span class="key">2</span>/<span class="key">3</span> 切换作物<br />
          <span class="key">M</span> 静音开关
        </div>
      </div>
      <div class="footnote">v0.1 · Canvas 2D</div>
    </aside>

    <!-- 中间农场 -->
    <div id="stage">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <canvas id="game"></canvas>
    </div>

    <!-- 右侧 -->
    <aside class="panel">
      <div class="card">
        <h3>作物选择</h3>
        <div id="crop-list"></div>
      </div>
      <div class="card">
        <h3>作物图鉴</h3>
        <div class="muted" id="crop-guide"></div>
      </div>
      <div class="card">
        <h3>经营提示</h3>
        <div class="muted">作物会随时间生长：刚种下是土堆，发芽后逐渐长大，成熟后发金光。生长越久的作物单株收益越高。</div>
      </div>
      <div class="footnote">made with ❤️ &amp; canvas</div>
    </aside>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
