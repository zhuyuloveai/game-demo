<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小厨合合 · 全量素材图鉴</title>
<style>*{box-sizing:border-box}body{margin:0;background:#faf4eb;color:#604733;font:14px system-ui}header{padding:20px 28px;background:#f0dfc9;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #6542}h1{font-size:22px;margin:0 0 8px}a{color:#98512c;margin-right:20px}input,select{padding:8px;border:1px solid #c7ae91;border-radius:7px;background:#fffaf2;margin-top:12px}main{padding:16px 28px}section{margin-bottom:26px}h2{font-size:17px}.chain{display:flex;flex-wrap:wrap;gap:10px}.asset{width:126px;border:1px solid #dccab3;border-radius:10px;padding:8px;background:#fffaf1}.asset .large{width:108px;height:94px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#f4e9db 0% 25%,#fffaf2 0% 50%) 50%/14px 14px;border-radius:6px}.asset .large img{max-width:94px;max-height:86px;filter:none}.small{display:flex;align-items:center;gap:10px;margin:8px 0}.shelf{position:relative;width:44px;height:44px;background:url('./slices/board-unified.webp') 0 0/308px 396px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2.25px}.item-3d{position:relative;display:block;width:var(--art-width);height:var(--art-height);flex:none}.item-3d:before{content:'';position:absolute;left:var(--contact-x);bottom:-.95px;width:var(--contact-width);height:var(--contact-height);transform:translateX(-50%);background:radial-gradient(ellipse at center,#6945204f 0%,#6f4b262e 34%,#76522b0f 56%,transparent 74%);filter:blur(.35px)}.item-3d img{width:100%;height:100%;position:relative;object-fit:contain;filter:drop-shadow(.55px .7px .65px #66431d36)}.dark{background:#493d35;width:44px;height:44px;display:flex;align-items:center;justify-content:center}.dark img{max-width:40px;max-height:38px}.name{min-height:36px;font-size:12px;line-height:18px}.id{color:#90775e;font:10px monospace}.pending{opacity:.45}.pending .large{background:#e8ded0}#status{font-size:13px}button{cursor:pointer}</style>
<header><h1>小厨合合 · 全量素材图鉴</h1><a href="./sample/">打开游戏样板</a><a href="./manifest.json">素材清单</a><span id="status"></span><br><input id="query" placeholder="搜索名称或物品 ID"><select id="family"><option value="">全部物品链</option></select></header><main></main>
<script type="module">
const [plan,manifest]=await Promise.all(['catalog-plan.json','manifest.json'].map(f=>fetch(f).then(r=>r.json())));document.querySelector('#status').textContent=`已接入 ${manifest.covered} / ${manifest.total} 项 · 44px 实际格内效果 + 深色边缘检查`;
const families=[...new Set(plan.items.map(x=>x.family))];for(const f of families){const i=plan.items.find(x=>x.family===f);document.querySelector('select').add(new Option(i.chain+' · '+f,f))}
function render(){const q=document.querySelector('input').value.toLowerCase(),fam=document.querySelector('select').value;document.querySelector('main').innerHTML=families.filter(f=>!fam||f===fam).map(f=>{const items=plan.items.filter(i=>i.family===f&&(!q||(i.id+i.name+i.chain).toLowerCase().includes(q)));if(!items.length)return '';return `<section data-family="${f}"><h2>${items[0].chain} <small>${f}</small></h2><div class="chain">${items.map(i=>{const a=manifest.items[i.id];if(!a)return `<article class="asset pending"><div class="large">待生成</div><div class="name">${i.level}. ${i.name}</div><div class="id">${i.id}</div></article>`;const src=a.src.replace('../','./');return `<article class="asset" data-id="${i.id}"><a href="${src}" class="large" target="_blank"><img src="${src}" loading="lazy" alt="${i.name}"></a><div class="small"><div class="shelf"><span class="item-3d" style="--art-width:${a.box[0]}px;--art-height:${a.box[1]}px;--contact-x:${a.contact.x}%;--contact-width:${a.contact.width}px;--contact-height:${a.contact.height}px"><img src="${src}" alt=""></span></div><div class="dark"><img src="${src}" alt=""></div></div><div class="name">${i.level}. ${i.name}</div><div class="id">${i.id}${a.alias?' · 兼容映射':''}</div></article>`}).join('')}</div></section>`}).join('')};document.querySelector('input').addEventListener('input',render);document.querySelector('select').addEventListener('change',render);render();
</script></html>
