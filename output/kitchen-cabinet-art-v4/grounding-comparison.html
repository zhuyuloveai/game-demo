<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物品落地感试调 · 小厨合合</title><style>*{box-sizing:border-box}body{margin:0;background:#eee5da;color:#60462e;font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:960px;margin:auto;padding:24px}h1{margin:0 0 8px;font-size:24px}p{margin:6px 0 16px}a{color:#376f83}.row{display:flex;gap:20px;overflow-x:auto}figure{margin:0;flex:none}figcaption{font-size:13px;margin-bottom:8px}.screen img{display:block;width:375px;height:667px}#grounding-detail{width:932px;padding:16px;background:#eee5da;margin:24px 0 0 -16px}#grounding-detail img{display:block;width:440px;height:264px;image-rendering:pixelated}h2{font-size:18px;margin:0 0 12px}.note{font-size:12px;color:#806a54;margin-top:12px}</style><main><h1>物品落地感 · 局部试调</h1><p>调整物品与格槽底面的接触：落点下移约1.75px，按物品底部形状补轻阴影，并微调部分物件大小。</p><p><a href="sample/grounding.html">打开可操作试调版</a> · <a href="sample/?art=unified-grid-v1">打开已保存版本</a></p><div class="row screen"><figure><figcaption>已保存版本 · 375×667</figcaption><img src="evidence/grounding/before-375x667.png" alt="物品接触关系修改前"></figure><figure><figcaption>局部试调 · 375×667</figcaption><img src="evidence/grounding/after-375x667.png" alt="落点与阴影试调"></figure></div><div id="grounding-detail"><h2>同一局部 · 看物品底部</h2><div class="row"><figure><figcaption>原样板：碗底与下沿之间留白较多</figcaption><img src="evidence/grounding/before-detail-4x.png" alt="修改前局部"></figure><figure><figcaption>试调：接触阴影收在物品底部</figcaption><img src="evidence/grounding/after-detail-4x.png" alt="修改后局部"></figure></div><p class="note">当前为独立试调页。连续格板、44px格距、原素材和已保存样板保持原样；此轮没有重新生成物品，也没有自动提交。</p></div><p class="note">视觉判断：漂浮感有所减轻。原稿的物品投影带有更细致的形状变化，现有通用柔影仍是近似，后续可按单件素材继续细化。</p></main></html>
