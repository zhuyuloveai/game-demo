</style><main><h1>小厨合合 · 厨房柜架素材 v4</h1><p>同一套左上柔光、奶油陶瓷与粉木柜架。界面素材 + 10 种物品样板，保留独立透明切片。</p><div class="tools"><a href="sample/">进入 375×667 样板</a><a href="comparison.html">同尺寸参考对照</a><a href="asset-manifest.json">裁区与用途数据</a><a href="generated-prompts.json">完整新增提示词</a></div><div class="notice">每张卡片依次展示奶油底、深色底和棋盘透明底；物品另附实际 44px 格槽。点击素材名称可看全尺寸 PNG。原图保存在 sources/，未覆盖任何交接候选图。</div><h2>10 种代表物品 · 实际显示 28–39px</h2><div id="items" class="grid"></div><h2>角色、资源与功能物件</h2><div id="ui" class="grid"></div><h2>面板与格槽</h2><div id="panels" class="grid"></div><h2>原始候选与方向参考</h2><div class="architecture"><figure><a href="reference.png"><img src="reference.png"></a><figcaption>用户选定参考</figcaption></figure><figure><a href="environment-source.png"><img src="environment-source.png"></a><figcaption>空柜架候选 · 按实际层板拆层</figcaption></figure><figure><a href="panels-source.png"><img src="panels-source.png"></a><figcaption>面板原图 · 逐件手动圈定裁区</figcaption></figure></div><p>美术审阅阶段。完整可玩版本的全量物品、所有长文本和移动端手感仍需后续接入验收。</p></main><script type="module">
const manifest=await(await fetch('asset-manifest.json')).json();const assets=new Map(manifest.assets.map(x=>[x.id,x]));
const groups={items:{wheat:'小麦',flour:'面粉',tomato:'番茄',orange:'香橙',strawberry:'草莓',bread:'吐司',bowl:'陶瓷碗',whisk:'打蛋器',saucepan:'炖锅样板',producer:'烘焙原料罐'},ui:{puppy:'原小白狗 · 红 M 帽',gift:'礼物',customer:'小猫顾客',deer:'小鹿顾客',bear:'阿熊顾客',panda:'团团顾客',energy:'体力闪电',pig:'金币小猪',stars:'心愿星罐',candy:'彩虹糖罐',book:'食谱槽',drawer:'收纳抽屉',phone:'采购手机',radio:'收音机'},panels:{'main-card':'主线纸卡','order-card':'普通订单纸卡','detail-plate':'金属细边详情牌','resource-plate':'资源数值牌','board-unified':'连续柜格 · 当前采用',cell:'旧单格 v2 · 已停用','cell-original':'格槽候选 v1'}};
for(const [group,entries]of Object.entries(groups))document.getElementById(group).innerHTML=Object.entries(entries).map(([id,name])=>{const a=assets.get(id);return `<figure><div class="stage"><img src="slices/${id}.webp" alt="${name}"></div><div class="edge-pair"><span><img src="slices/${id}.webp"></span><span><img src="slices/${id}.webp"></span></div><figcaption><div class="row"><div><a href="slices/${id}.png"><b>${name}</b></a><small>${id}<br>实际源裁区 ${a.cropInSource?a.cropInSource.join(', '):'实测隔板配准，见board-registration.json'}</small></div>${group==='items'?`<div class="target"><img src="slices/${id}.webp"></div>`:''}</div></figcaption></figure>`}).join('');
</script></html>
